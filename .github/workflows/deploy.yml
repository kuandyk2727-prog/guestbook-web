name: Deploy GuestBook to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: dotnet publish -c Release -o ./publish

    - name: Install Web Deploy if missing
      shell: pwsh
      run: |
        if (-not (Test-Path "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe")) {
          choco install webdeploy -y --no-progress
        }

    - name: Deploy to MonsterASP.NET
      shell: cmd
      env:
        DEST_SITE: site96475
        DEST_URL: https://site96475.siteasp.net:8172/msdeploy.axd?site=site96475
        DEPLOY_USER: site96475
        DEPLOY_PASS: ${{ secrets.SERVER_PASSWORD }}
      run: >
        "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        -verb:sync
        -source:contentPath="%GITHUB_WORKSPACE%\publish"
        -dest:contentPath="%DEST_SITE%",computerName="%DEST_URL%",userName="%DEPLOY_USER%",password="%DEPLOY_PASS%",authtype="Basic",includeAcls="False"
        -allowUntrusted
        -disableLink:AppPoolExtension
        -disableLink:ContentExtension
        -disableLink:CertificateExtension
        -verbose